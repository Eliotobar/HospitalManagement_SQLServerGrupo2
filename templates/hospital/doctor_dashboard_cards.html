{% extends 'hospital/doctor_base.html' %}
{% load static %}
{% block content %}

<div class="container-fluid mt-4">
  <div class="row g-4">

    <!-- Citas -->
    <div class="col-md-4">
      <div class="card shadow-sm border-0 stat-card bg-gradient-primary text-white h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h3 class="fw-bold">{{ appointmentcount }}</h3>
            <h5 class="fw-normal">Citas Registradas</h5>
          </div>
          <i class="fa-solid fa-calendar-check fa-3x"></i>
        </div>
      </div>
    </div>

    <!-- Pacientes bajo su cuidado -->
    <div class="col-md-4">
      <div class="card shadow-sm border-0 stat-card bg-gradient-warning text-white h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h3 class="fw-bold">{{ patientcount }}</h3>
            <h5 class="fw-normal">Pacientes a su cargo</h5>
          </div>
          <i class="fa-solid fa-user-injured fa-3x"></i>
        </div>
      </div>
    </div>

    <!-- Pacientes dados de alta -->
    <div class="col-md-4">
      <div class="card shadow-sm border-0 stat-card bg-gradient-success text-white h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h3 class="fw-bold">{{ patientdischarged }}</h3>
            <h5 class="fw-normal">Pacientes dados de alta</h5>
          </div>
          <i class="fa-solid fa-circle-check fa-3x"></i>
        </div>
      </div>
    </div>

  </div>
</div>

<style>
  .bg-gradient-primary {
    background: linear-gradient(45deg, #007bff, #00c6ff);
  }

  .bg-gradient-warning {
    background: linear-gradient(45deg, #ff9800, #ffc107);
  }

  .bg-gradient-success {
    background: linear-gradient(45deg, #28a745, #43e97b);
  }

  .stat-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border-radius: 12px;
  }

  .stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.2);
  }

  h3 {
    font-size: 2.3rem;
  }

  h5 {
    font-size: 1.1rem;
  }
</style>

{% endblock content %}
