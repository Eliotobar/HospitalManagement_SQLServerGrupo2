<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    footer {
      background: #0d1b2a;
      color: #dcdcdc;
      padding: 40px 0 20px 0;
      text-align: center;
      font-family: 'Roboto', sans-serif;
    }

    .footer-logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #64b5f6;
      letter-spacing: 1px;
    }

    .footer-social {
      margin: 20px 0;
    }

    .footer-social a {
      display: inline-block;
      margin: 0 10px;
      font-size: 1.3rem;
      color: #fff;
      background: #1e3a8a;
      padding: 12px;
      border-radius: 50%;
      transition: 0.3s;
    }

    .footer-social a:hover {
      background: #64b5f6;
      color: #0d1b2a;
      transform: translateY(-3px);
    }

    .footer-bottom {
      font-size: 0.9rem;
      margin-top: 10px;
      color: #aaa;
    }

    .footer-bottom a {
      color: #64b5f6;
      text-decoration: none;
    }

    .footer-bottom a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .footer-social a {
        font-size: 1.1rem;
        padding: 10px;
        margin: 0 5px;
      }
    }
  </style>
</head>

<body>
  <footer>
    <div class="footer-logo">🏥 Hospital Management System</div>

    <div class="footer-social">
      <a href="#" class="fa-brands fa-facebook-f" title="Facebook"></a>
      <a href="#" class="fa-brands fa-twitter" title="Twitter"></a>
      <a href="#" class="fa-brands fa-instagram" title="Instagram"></a>
      <a href="#" class="fa-brands fa-whatsapp" title="WhatsApp"></a>
    </div>

    <div class="footer-bottom">
      <p>© 2025 Desarrollado por <a href="#">Tu Equipo de Desarrollo</a></p>
      <p>Todos los derechos reservados</p>
    </div>
  </footer>
</body>

</html>
