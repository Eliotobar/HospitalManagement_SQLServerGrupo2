{% extends 'hospital/doctor_base.html' %}
{% load static %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    
    <!-- Pacientes actuales -->
    <div class="col-md-6 mb-4">
      <div class="card text-white shadow-lg border-0" style="background: linear-gradient(135deg, #4e73df, #1cc88a);">
        <div class="card-body text-center py-4">
          <i class="fas fa-user-injured fa-3x mb-3"></i>
          <h5 class="fw-bold mb-3">Registros de Pacientes</h5>
          <a href="/doctor-view-patient" class="btn btn-light btn-sm px-4 fw-semibold shadow-sm">
            Ver Pacientes
          </a>
        </div>
      </div>
    </div>

    <!-- Pacientes dados de alta -->
    <div class="col-md-6 mb-4">
      <div class="card text-white shadow-lg border-0" style="background: linear-gradient(135deg, #e74a3b, #f6c23e);">
        <div class="card-body text-center py-4">
          <i class="fas fa-procedures fa-3x mb-3"></i>
          <h5 class="fw-bold mb-3">Pacientes Dados de Alta</h5>
          <a href="/doctor-view-discharge-patient" class="btn btn-light btn-sm px-4 fw-semibold shadow-sm">
            Ver Altas
          </a>
        </div>
      </div>
    </div>

  </div>
</div>

{% endblock content %}
