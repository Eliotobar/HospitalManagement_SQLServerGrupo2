<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - HMS</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Estilos personalizados -->
  <style>
    body {
      padding-left: 250px;
      background-color: #f7f9fc;
    }

    .menu {
      background: #007bff;
      height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      text-align: center;
      padding: 1.5rem 1rem;
      background-color: rgba(0, 0, 0, 0.1);
    }

    .avatar img {
      width: 100px;
      border-radius: 50%;
      border: 3px solid #fff;
    }

    .avatar h2 {
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .menu ul {
      list-style: none;
      padding: 0;
    }

    .menu ul li {
      padding: 0.9rem 1rem;
      transition: all 0.2s;
    }

    .menu ul li:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .menu ul li i {
      margin-right: 10px;
    }

    .menu ul li a {
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <nav class="menu">
    <div>
      <div class="avatar">
        <img src="{% static 'images/adminpropic.png' %}" alt="Admin">
        <h6>Administrador</h6>
        <h2>{{ request.user.first_name }}</h2>
      </div>
      <ul>
        <li><a href="/admin-dashboard"><i class="fa-solid fa-gauge"></i> Panel</a></li>
        <li><a href="/admin-doctor"><i class="fa-solid fa-user-md"></i> Doctores</a></li>
        <li><a href="/admin-patient"><i class="fa-solid fa-bed-pulse"></i> Pacientes</a></li>
        <li><a href="/admin-appointment"><i class="fa-solid fa-calendar-check"></i> Citas</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <nav class="navbar navbar-dark bg-primary fixed-top" style="margin-left:250px;">
      <div class="container-fluid">
        <a href="/admin-dashboard" class="navbar-brand">Hospital Management</a>
        <form action="{% url 'logout' %}" method="post" class="d-flex">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light">
            <i class="fa fa-sign-out-alt"></i> Cerrar sesión
          </button>
        </form>
      </div>
    </nav>

    <div class="container-fluid" style="margin-top: 80px;">
      {% block content %}
      {% endblock content %}
    </div>

    <footer>
      <p>© 2025 - Sistema de Gestión Hospitalaria | Desarrollado con Django</p>
    </footer>
  </main>

</body>
</html>
