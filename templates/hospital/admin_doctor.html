{% extends 'hospital/admin_base.html' %}
{% load static %}
{% block content %}
<br><br>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    a {
      text-decoration: none;
    }

    h6 {
      color: white;
    }

    .order-card {
      color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .bg-c-blue {
      background: linear-gradient(45deg, #4099ff, #73b4ff);
    }

    .bg-c-green {
      background: linear-gradient(45deg, #2ed8b6, #59e0c5);
    }

    .bg-c-yellow {
      background: linear-gradient(45deg, #FFB64D, #ffcb80);
    }

    .bg-c-pink {
      background: linear-gradient(45deg, #FF5370, #ff869a);
    }

    .card .card-body {
      padding: 30px;
    }

    .order-card i {
      font-size: 40px;
    }

    .text-right {
      text-align: right;
    }

    .f-left {
      float: left;
    }

    .f-right {
      float: right;
    }
  </style>
</head>

<body>
  <div class="container mt-4">
    <div class="text-center mb-5">
      <h3 class="text-primary fw-bold">
        <i class="fa-solid fa-user-doctor"></i> Panel de Gestión de Doctores
      </h3>
      <p class="text-muted">Administra registros, aprobaciones y especialidades de los doctores</p>
    </div>

    <div class="row justify-content-center">

      <!-- Ver doctores -->
      <div class="col-md-6 col-xl-3 mb-4">
        <div class="card bg-c-blue order-card">
          <div class="card-body">
            <a href="/admin-view-doctor">
              <h6 class="m-b-20 text-white fw-bold">Ver Doctores</h6>
            </a>
            <div class="text-right">
              <i class="fas fa-user-nurse f-left"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Registrar doctor -->
      <div class="col-md-6 col-xl-3 mb-4">
        <div class="card bg-c-green order-card">
          <div class="card-body">
            <a href="/admin-add-doctor">
              <h6 class="m-b-20 text-white fw-bold">Registrar Doctor</h6>
            </a>
            <div class="text-right">
              <i class="fas fa-user-plus f-left"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Aprobar doctores -->
      <div class="col-md-6 col-xl-3 mb-4">
        <div class="card bg-c-yellow order-card">
          <div class="card-body">
            <a href="/admin-approve-doctor">
              <h6 class="m-b-20 text-white fw-bold">Aprobar Doctores</h6>
            </a>
            <div class="text-right">
              <i class="fas fa-check-circle f-left"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Especializaciones -->
      <div class="col-md-6 col-xl-3 mb-4">
        <div class="card bg-c-pink order-card">
          <div class="card-body">
            <a href="/admin-view-doctor-specialisation">
              <h6 class="m-b-20 text-white fw-bold">Especialidades Médicas</h6>
            </a>
            <div class="text-right">
              <i class="fas fa-stethoscope f-left"></i>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>

{% endblock content %}
